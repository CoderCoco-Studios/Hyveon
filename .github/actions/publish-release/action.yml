name: Publish draft release
description: Download every platform's installers plus the release notes and create the draft GitHub Release. Only call after all platform builds succeeded.
inputs:
  tag:
    description: Release tag to create the draft release for.
    required: true
runs:
  using: composite
  steps:
    - name: Download installers
      uses: actions/download-artifact@v8
      with:
        pattern: pkg-*
        path: dist

    - name: Download release notes
      uses: actions/download-artifact@v8
      with:
        name: release-notes
        path: notes

    # The release only comes into existence here, after every platform build succeeded.
    # An upload can still fail part-way, leaving a draft with some assets; the cleanup step removes it.
    # @spec APP-UPDATE-DRAFT-001
    - name: Create GitHub Release and attach artifacts
      id: release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.tag }}
        body_path: notes/release-notes.md
        files: dist/**/*
        draft: true

    # electron-updater needs the latest*.yml feeds, and users need installers.
    # Fail the run (leaving the draft unpublished) if any are missing.
    # Looked up by release id because `gh release view <tag>` does not resolve drafts.
    # @spec APP-UPDATE-DRAFT-003
    - name: Verify feed and installer assets
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.release.outputs.id }}
      run: |
        set -euo pipefail

        names=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.assets[].name')
        echo "Release assets:"
        echo "$names" | sed 's/^/  /'

        missing=()
        for feed in latest.yml latest-mac.yml latest-linux.yml; do
          echo "$names" | grep -Fxq "$feed" || missing+=("$feed")
        done
        for ext in exe dmg zip AppImage; do
          echo "$names" | grep -Eq "\.${ext}$" || missing+=("*.${ext}")
        done

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Release is missing required assets: ${missing[*]}" >&2
          exit 1
        fi
        echo "All required feed and installer assets are present."

    # A draft that failed verification (or upload) must not linger without its assets.
    # The action sets `outputs.id` only after every upload succeeds, so an upload failure leaves it empty:
    # the draft is then found by tag. Only drafts are ever deleted, never a published release.
    # @spec APP-UPDATE-DRAFT-004
    - name: Delete incomplete draft
      if: ${{ failure() }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.release.outputs.id }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if [ -z "${RELEASE_ID}" ]; then
          RELEASE_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' | head -n 1)
        fi
        if [ -z "${RELEASE_ID}" ]; then
          echo "No draft release found for the tag; nothing to delete."
          exit 0
        fi
        [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)" = true ] || {
          echo "::notice::Release ${RELEASE_ID} is not a draft; leaving it."
          exit 0
        }
        gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
        echo "::warning::Deleted the incomplete draft release (id ${RELEASE_ID})."
