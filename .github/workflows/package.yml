name: Package

on:
  merge_group:
    types: [checks_requested]
  pull_request:

permissions:
  contents: read

jobs:
  # Doc-only PRs (markdown files only) skip packaging entirely — a skipped
  # required job still satisfies GitHub's required-status-check gate. Release
  # builds live in release.yml and share the steps via .github/actions/.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'

  package:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            # latest-linux.yml is the electron-updater feed manifest;
            # *.blockmap enables differential (not full) update downloads.
            # Both are written by electron-builder alongside the installer
            # whenever `publish` is configured, regardless of `--publish never`.
            artifact_glob: |
              release/*.AppImage
              release/latest-linux.yml
              release/*.blockmap
            artifact_name: pkg-linux-AppImage
          - os: macos-latest
            # electron-updater's MacUpdater only ever fetches a `zip` asset
            # (it ignores dmg/pkg outright), so the zip build + latest-mac.yml
            # feed manifest must ship alongside the dmg installer.
            artifact_glob: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
            artifact_name: pkg-mac-dmg
          - os: windows-latest
            # latest.yml is the electron-updater feed manifest for NSIS.
            artifact_glob: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
            artifact_name: pkg-win-nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-app

      - uses: ./.github/actions/build-package
        with:
          artifact_name: ${{ matrix.artifact_name }}
          artifact_glob: ${{ matrix.artifact_glob }}
