name: Package

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Doc-only PRs (markdown files only) skip packaging entirely — a skipped
  # required job still satisfies GitHub's required-status-check gate. Tag
  # pushes always run regardless of the diff, since those are real releases.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            # latest-linux.yml is the electron-updater feed manifest;
            # *.blockmap enables differential (not full) update downloads.
            # Both are written by electron-builder alongside the installer
            # whenever `publish` is configured, regardless of `--publish never`.
            artifact_glob: |
              release/*.AppImage
              release/latest-linux.yml
              release/*.blockmap
            artifact_name: linux-AppImage
          - os: macos-latest
            # electron-updater's MacUpdater only ever fetches a `zip` asset
            # (it ignores dmg/pkg outright), so the zip build + latest-mac.yml
            # feed manifest must ship alongside the dmg installer.
            artifact_glob: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
            artifact_name: mac-dmg
          - os: windows-latest
            # latest.yml is the electron-updater feed manifest for NSIS.
            artifact_glob: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
            artifact_name: win-nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Restore @tailwindcss/oxide native binding
        # The lockfile was generated on a linux-x64 host, so the optional
        # platform-specific binaries for darwin-arm64 (macos-15-arm64) and
        # win32-x64-msvc are missing. Re-install to fetch the correct binary
        # for the current runner before the Vite build step.
        run: npm install --no-save @tailwindcss/oxide@4.3.0

      - name: Build workspace packages
        run: npm run app:build

      - name: Package desktop app
        run: npm run desktop:package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
