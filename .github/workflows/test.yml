name: Test

# Non-code paths (docs, OpenSpec artifacts, Claude Code hooks/config) never
# affect the npm build, so `paths-ignore` skips this workflow entirely for
# PRs that only touch them. GitHub still satisfies the required-check gate
# for a workflow that never triggers, as long as the merge queue/ruleset
# isn't set to wait indefinitely for a named check that never reports.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:test:coverage

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-typescript
          path: app/coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
