name: Lint

# Non-code paths (docs, OpenSpec artifacts, Claude Code hooks/config) never
# affect the npm build, so `paths-ignore` skips this workflow entirely for
# PRs that only touch them. GitHub still satisfies the required-check gate
# for a workflow that never triggers, as long as the merge queue/ruleset
# isn't set to wait indefinitely for a named check that never reports.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:lint

  # Nothing else in CI ran the TypeScript compiler: `app:test` transpiles
  # without typechecking, and both `desktop:build` and `desktop:package` go
  # through electron-vite/esbuild, which strips types rather than checking
  # them. `app:typecheck` builds the packages whose declarations the rest
  # depend on, then runs `tsc --noEmit` over web (including its Playwright
  # configs and e2e specs), all five Lambda packages, and scripts — so a type
  # error in any workspace now fails the PR instead of surfacing at runtime.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # This job only installs and compiles — it never pushes — so the
          # checkout credentials are not needed past the clone. Dropping them
          # keeps GITHUB_TOKEN out of .git/config for the rest of the run.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:typecheck
