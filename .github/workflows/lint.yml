name: Lint

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Doc-only PRs (markdown files only) skip lint/typecheck entirely — a
  # skipped required job still satisfies GitHub's required-status-check gate,
  # unlike a workflow that never triggers at all (paths-ignore on `on:` would
  # leave the check permanently pending and block merge).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'

  eslint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:lint

  # Nothing else in CI ran the TypeScript compiler: `app:test` transpiles
  # without typechecking, and both `desktop:build` and `desktop:package` go
  # through electron-vite/esbuild, which strips types rather than checking
  # them. `app:typecheck` builds the packages whose declarations the rest
  # depend on, then runs `tsc --noEmit` over web (including its Playwright
  # configs and e2e specs), all five Lambda packages, and scripts — so a type
  # error in any workspace now fails the PR instead of surfacing at runtime.
  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # This job only installs and compiles — it never pushes — so the
          # checkout credentials are not needed past the clone. Dropping them
          # keeps GITHUB_TOKEN out of .git/config for the rest of the run.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:typecheck
