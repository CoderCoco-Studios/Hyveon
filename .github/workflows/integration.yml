name: Integration Tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Doc-only PRs (markdown files only) skip integration tests entirely — a
  # skipped required job still satisfies GitHub's required-status-check gate.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-app

      - run: npm run app:test:integration

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-playwright-report
          path: app/packages/web/playwright-report/
          retention-days: 30
