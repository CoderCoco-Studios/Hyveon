name: Integration Tests

# Non-code paths (docs, OpenSpec artifacts, Claude Code hooks/config) never
# affect the npm build, so `paths-ignore` skips this workflow entirely for
# PRs that only touch them. GitHub still satisfies the required-check gate
# for a workflow that never triggers, as long as the merge queue/ruleset
# isn't set to wait indefinitely for a named check that never reports.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'docs/**'
      - 'openspec/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run app:test:integration

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-playwright-report
          path: app/packages/web/playwright-report/
          retention-days: 30
