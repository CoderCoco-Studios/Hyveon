schema_version: 2
last_updated: 2026-10-31

# Taxonomy: three grouping-node clusters plus four flat root-level leaves.
taxonomy:
  iac:
    - run
    - engine
    - program
  game-runtime:
    - task-and-dns
    - watchdog
    - health-check
  operator-app:
    - wizard-and-bootstrap
    - diagnostics
    - infra-logs
    - app-update-and-release
    - desktop-shell
    - ipc-bridge
  game-server: standalone
  deployment-config: standalone
  discord-bot: standalone
  helper-task: standalone

# Design tree. Grouping nodes (sub-HLDs) point `detail` at their future design
# doc under docs/intent/<group>/<group>-design.md (not yet written). Leaves point
# at their tree-mirrored arrow doc under docs/arrows/.
#
# blockedBy edges come from each arrow doc's "Cited from other leaves" section,
# keeping only citations the leaf's core behaviour depends on. ipc-bridge is
# listed only where the arrow doc names a bridge dependency as load-bearing
# (self-bridged streaming channels). The graph is acyclic except run <-> engine.
arrows:
  # ---------------------------------------------------------------- iac
  iac:
    status: MAPPED
    parent: null
    children: [run, engine, program]
    blocks: []
    blockedBy: []
    detail: ../intent/iac/iac-design.md
    next: "Write the iac sub-HLD design doc."
    drift: null

  run:
    status: MAPPED
    parent: iac
    sampled: 2026-10-30
    audited: null
    audited_sha: null
    blocks: [engine]
    # Mutual with engine (real): run's gate logic (8-step apply gate, destroy
    # token, rollback, stale-lock clear) physically lives in engine-owned
    # PulumiService.ts, while engine is driven by run's RunService/iac.controller.
    blockedBy: [engine, deployment-config, ipc-bridge]
    detail: iac/run.md
    next: "Persist and restore partialApply in AwsRunRecordStore.putRecord/toRunRecord, with a store test."
