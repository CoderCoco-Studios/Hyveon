# Items found during mapping that don't belong to a leaf.
# `docs.openspec` and `docs.pages` are project extensions beyond the base
# schema (which defines only `docs.intent`); the schema permits extensions.
unmapped:
  docs:
    intent: []
    # OpenSpec capabilities with no owning leaf (final-clustering §1).
    openspec:
      - operator-documentation
      - docs-screenshot-capture
      - node-toolchain-version
    # final-clustering §2 "Unassigned" leaves all of docs/** to
    # operator-documentation; leaves cite these pages but none owns them.
    pages:
      - docs/docs/intro.md
      - docs/docs/install.md
      - docs/docs/setup.md
      - docs/docs/architecture.md
      - docs/docs/code-signing-roadmap.md
      - docs/docs/app/index.md
      - docs/docs/app/audit.md
      - docs/docs/app/costs.md
      - docs/docs/app/dashboard.md
      - docs/docs/app/discord.md
      - docs/docs/app/first-run-wizard.md
      - docs/docs/app/games.md
      - docs/docs/app/iac.md
      - docs/docs/app/logs.md
      - docs/docs/app/settings.md
      - docs/docs/components/index.md
      - docs/docs/components/infra.md
      - docs/docs/components/integration-tests.md
      - docs/docs/components/lambdas.md
      - docs/docs/components/management-app.md
      - docs/docs/guides/index.md
