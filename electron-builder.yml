appId: dev.gsd.desktop
productName: Hyveon
asar: true
npmRebuild: false

directories:
  output: release
  app: "."

files:
  - out/**
  # @cdktf/hcl2json is deliberately NOT bundled into out/main (see the
  # `external` entry in electron.vite.config.ts) — its wasm bridge must load
  # main.wasm.gz relative to its own module file, and its bundled copy breaks
  # Electron's quit path. Ship the module and its transitive runtime deps
  # (fs-extra → graceful-fs/jsonfile/universalify) so the packaged main
  # process can resolve the bare `import '@cdktf/hcl2json'`.
  - node_modules/@cdktf/hcl2json/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/jsonfile/**
  - node_modules/universalify/**

extraResources:
  - from: terraform/terraform.tfstate
    to: terraform/aws/terraform.tfstate
  # The window/taskbar icon is set at runtime by electron-entry.ts, which needs
  # a real file on disk — Windows and macOS read theirs from the executable and
  # the app bundle, but Linux does not.
  - from: build/icon.png
    to: icon.png

# Icon assets are generated from build/icon.svg by `npm run icons:generate` and
# committed, so packaging never has to rasterise anything. build/ is also
# electron-builder's default buildResources directory, which means the NSIS
# installer picks up build/icon.ico for its own window and uninstaller too.
win:
  icon: build/icon.ico
  target:
    - nsis

mac:
  icon: build/icon.icns
  hardenedRuntime: false
  target:
    - dmg

linux:
  icon: build/icon.png
  target:
    - AppImage
