appId: dev.hyveon.desktop
productName: Hyveon
asar: true
npmRebuild: false

directories:
  output: release
  app: "."

# Embeds electron-updater's app-update.yml feed metadata into every packaged
# target. Release *publishing* stays owned by .github/workflows/package.yml's
# tag-triggered `softprops/action-gh-release` job — desktop:package always
# runs with `--publish never` (see package.json) so electron-builder itself
# never uploads to GitHub Releases, even though GH_TOKEN is present in CI.
publish:
  provider: github
  owner: CoderCoco
  repo: Hyveon

files:
  - out/**
  # @pulumi/pulumi and @pulumi/aws are deliberately NOT bundled into out/main
  # (see the `external` entries in electron.vite.config.ts) — `@pulumi/pulumi`
  # pulls in `@grpc/grpc-js`, which owns sockets, and bundling either package
  # (60 MB / 15 MB unpacked) risks an "Electron never quits" failure — the
  # same failure mode the retired `@cdktf/hcl2json` externalization here once
  # guarded against, before the `migrate-iac-to-pulumi` change removed that
  # dependency entirely. `graceful-fs` below is a transitive dependency of
  # this closure (via `@npmcli/*` → `node-gyp`), not a leftover from that
  # retired entry. Ship both packages and their full transitive runtime-dependency
  # closure — computed by walking each
  # package's own package.json "dependencies" AND "optionalDependencies"
  # fields recursively from the installed node_modules tree (optional deps
  # matter here: minipass-fetch → iconv-lite → safer-buffer is an
  # optionalDependencies chain, not a regular one, and is still installed and
  # required at runtime) — so the packaged main process can resolve the
  # external `@pulumi/pulumi` / `@pulumi/aws` imports. Entries are collapsed
  # to `@scope/**` where every package under that scope in this tree belongs
  # to the closure (@npmcli/*, @opentelemetry/*, etc.) — @types/** is the one
  # scope deliberately NOT collapsed, since most @types/* packages in this
  # repo are unrelated devDependency type declarations; only the two actual
  # @pulumi/pulumi runtime deps (@types/google-protobuf, @types/semver) are
  # listed. Nested transitive deps (e.g. execa's own
  # `node_modules/get-stream`) are covered by their parent's `/**` glob and
  # are not listed separately. Re-walk the closure whenever the pinned pulumi
  # versions change — new transitive deps will not be picked up
  # automatically.
  - node_modules/@pulumi/pulumi/**
  - node_modules/@pulumi/aws/**
  - node_modules/@gar/**
  - node_modules/@grpc/**
  - node_modules/@isaacs/**
  - node_modules/@js-sdsl/**
  - node_modules/@logdna/**
  - node_modules/@npmcli/**
  - node_modules/@opentelemetry/**
