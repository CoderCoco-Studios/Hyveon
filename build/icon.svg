<?xml version="1.0" encoding="UTF-8"?>
<!-- Hyveon app icon — master artwork. Keep this header short: libvips sniffs
     only the first 1000 bytes for the <svg> tag, so a long comment here makes
     the file unreadable to the generator. Notes live inside the element. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Concept: seven honeycomb cells make up the hive (the fleet of game servers);
    exactly one cell is lit, because Hyveon runs a server only while you want it
    running. The palette is taken verbatim from the app's design tokens in
    app/packages/web/src/index.css so the icon matches the UI it opens.

    Geometry: cells sit on a 281.7-unit lattice and are drawn at radius 128 with
    a 34-wide stroke, leaving a 26-unit channel of background between adjacent
    cell walls. Those numbers are linked — the visible gap is
    `spacing - sqrt(3) * radius - stroke` — so changing one without re-deriving
    the others makes neighbouring cells bleed into each other.

    This file is the single source of truth for every packaged icon. After
    editing it, run `npm run icons:generate` to rebuild icon.png / icon.ico /
    icon.icns and the web favicons. Sizes at or below 24px use icon-small.svg
    instead: the seven cells stop resolving below 32px and blur together.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f33"/>
      <stop offset="1" stop-color="#0d0f18"/>
    </linearGradient>
    <linearGradient id="core" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#ground)"/>

  <!-- Six dormant cells: stroked outlines, no fill. -->
  <g fill="none" stroke="#7c3aed" stroke-width="34" stroke-linejoin="round" opacity="0.55">
    <path d="M 793.7 384 L 904.55 448 L 904.55 576 L 793.7 640 L 682.85 576 L 682.85 448 Z"/>
    <path d="M 652.85 627.96 L 763.7 691.96 L 763.7 819.96 L 652.85 883.96 L 542 819.96 L 542 691.96 Z"/>
    <path d="M 371.15 627.96 L 482 691.96 L 482 819.96 L 371.15 883.96 L 260.3 819.96 L 260.3 691.96 Z"/>
    <path d="M 230.3 384 L 341.15 448 L 341.15 576 L 230.3 640 L 119.45 576 L 119.45 448 Z"/>
    <path d="M 371.15 140.04 L 482 204.04 L 482 332.04 L 371.15 396.04 L 260.3 332.04 L 260.3 204.04 Z"/>
    <path d="M 652.85 140.04 L 763.7 204.04 L 763.7 332.04 L 652.85 396.04 L 542 332.04 L 542 204.04 Z"/>
  </g>

  <!-- The one running server. Drawn at radius 145 — the cell radius plus half a
       stroke — so its silhouette matches the outer edge of the dormant cells. -->
  <path d="M 512 367 L 637.57 439.5 L 637.57 584.5 L 512 657 L 386.43 584.5 L 386.43 439.5 Z" fill="url(#core)"/>
</svg>
